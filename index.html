<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portfolio de Javier Motos González — estudiante de grado en informática, disponible para prácticas en desarrollo de software.">
  <title>Javier Motos González — Portfolio</title>

  <!-- Favicon -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- CSS COMPLETO INLINE — Todo el sistema de diseño DESIGN-001 -->
  <style>
    /* ============================================================
       1. TOKENS — Custom properties (DESIGN-001 §1-§3)
       ============================================================ */
    :root {
      /* --- §1 Color · Neutros --- */
      --bg: #FFFFFF;
      --ink: #0A0A0A;
      --ink-2: #404040;
      --muted: #595959;
      --surface: #F5F5F5;
      --surface-2: #EDEDED;
      --border: #E5E5E5;
      --border-strong: #D4D4D4;
      --btn: #171717;
      --btn-ink: #FAFAFA;

      /* --- §1 Color · Acento (Violeta por defecto) --- */
      --accent: #6D28D9;
      --accent-soft: #EDE9FE;

      /* --- §1 Color · Semánticos --- */
      --ok: #047857;
      --warn: #A16207;
      --bad: #B91C1C;

      /* --- §2 Tipografía --- */
      --font-text: "Geist", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --weight-regular: 400;
      --weight-medium: 500;
      --weight-semibold: 600;
      --text-hero: clamp(40px, 6vw, 64px);
      --leading-hero: 1.05;
      --text-lead: 20px;
      --leading-lead: 30px;
      --text-body: 17px;
      --leading-body: 28px;
      --text-h2: 28px;
      --leading-h2: 1.2;
      --text-project-featured: 24px;
      --leading-project-featured: 1.2;
      --text-project: 18px;
      --leading-project: 1.3;
      --text-summary: 15px;
      --leading-summary: 24px;
      --text-meta: 13px;
      --leading-meta: 20px;
      --text-eyebrow: 12px;
      --tracking-eyebrow: 0.12em;

      /* --- §3 Espacio y medidas --- */
      --max-content: 1120px;
      --max-reading: 720px;
      --gutter: 24px;
      --section-gap: 64px;
      --topbar-h: 56px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;

      /* --- §5 Movimiento --- */
      --ease: cubic-bezier(.2, .8, .2, 1);
      --dur-fast: 150ms;
      --dur-mid: 200ms;
      --dur-slow: 400ms;
      --stagger: 60ms;
    }

    /* §3 — Desktop: márgenes y separaciones */
    @media (min-width: 900px) {
      :root {
        --gutter: 48px;
        --section-gap: 96px;
      }
    }

    /* Variantes de acento */
    html[data-accent="azul"]     { --accent: #1D4ED8; --accent-soft: #DBEAFE; }
    html[data-accent="verde"]    { --accent: #047857; --accent-soft: #D1FAE5; }
    html[data-accent="naranja"]  { --accent: #C2410C; --accent-soft: #FFEDD5; }
    html[data-accent="rosa"]     { --accent: #BE185D; --accent-soft: #FCE7F3; }
    html[data-accent="amarillo"] { --accent: #A16207; --accent-soft: #FEF3C7; }

    /* ============================================================
       2. BASE — Reset y tipografía
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-text);
      font-size: var(--text-body);
      line-height: var(--leading-body);
      font-weight: var(--weight-regular);
    }

    img { max-width: 100%; display: block; }
    a { color: inherit; }

    .mono {
      font-family: var(--font-mono);
      font-size: var(--text-meta);
      line-height: var(--leading-meta);
    }

    /* ============================================================
       6. ACCESIBILIDAD
       ============================================================ */
    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      padding: 8px 16px;
      background: var(--btn);
      color: var(--btn-ink);
      border-radius: var(--radius-sm);
      z-index: 100;
    }
    .skip-link:focus {
      left: 8px;
      top: 8px;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    #contenido:focus,
    #contenido:focus-visible {
      outline: none;
    }

    /* ============================================================
       BARRA SUPERIOR
       ============================================================ */
    .topbar {
      height: var(--topbar-h);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
    }
    .topbar__inner {
      width: 100%;
      max-width: var(--max-content);
      margin: 0 auto;
      padding: 0 var(--gutter);
    }
    .topbar__identity {
      font-weight: var(--weight-medium);
      text-decoration: none;
    }

    /* ============================================================
       PORTADA (hero)
       ============================================================ */
    .hero {
      max-width: var(--max-reading);
      margin: 0 auto;
      padding: var(--section-gap) var(--gutter) 0;
    }
    .hero__foto {
      width: 96px;
      height: 96px;
      border-radius: var(--radius-full);
      object-fit: cover;
    }
    .hero__nombre {
      font-size: var(--text-hero);
      line-height: var(--leading-hero);
      font-weight: var(--weight-semibold);
      margin: 16px 0 8px;
    }
    .hero__entradilla {
      font-size: var(--text-lead);
      line-height: var(--leading-lead);
      color: var(--ink-2);
      margin: 0 0 16px;
    }
    .hero__titular { margin: 0 0 8px; }

    .hero__contacto { margin: 16px 0 0; }
    .hero__contacto a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid var(--border-strong);
    }
    .hero__contacto a:hover {
      border-bottom-color: var(--accent);
    }

    /* Píldora de disponibilidad */
    .pildora {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 28px;
      padding: 0 14px;
      border-radius: var(--radius-full);
      background: var(--surface);
      font-family: var(--font-mono);
      font-size: var(--text-meta);
      line-height: var(--leading-meta);
      color: var(--muted);
    }
    .pildora::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: var(--radius-full);
      background: var(--accent);
    }

    /* ============================================================
       SECCIONES
       ============================================================ */
    .seccion {
      max-width: var(--max-content);
      margin: 0 auto;
      padding: var(--section-gap) var(--gutter) 0;
    }

    .antetitulo {
      font-family: var(--font-mono);
      font-size: var(--text-eyebrow);
      letter-spacing: var(--tracking-eyebrow);
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 4px;
    }
    .seccion h2 {
      font-size: var(--text-h2);
      line-height: var(--leading-h2);
      font-weight: var(--weight-semibold);
      margin: 0 0 24px;
    }

    .prosa {
      max-width: var(--max-reading);
      color: var(--ink-2);
    }

    /* ============================================================
       SOBRE MÍ
       ============================================================ */
    .sobre-mi {
      max-width: var(--max-reading);
    }
    .sobre-mi__descripcion {
      margin: 0 0 24px;
    }
    .sobre-mi__datos {
      margin: 0 0 24px;
      padding: 0;
    }
    .sobre-mi__etiqueta {
      font-family: var(--font-mono);
      font-size: var(--text-meta);
      line-height: var(--leading-meta);
      color: var(--muted);
      margin: 0;
    }
    .sobre-mi__valor {
      margin: 0 0 8px;
      padding: 0;
    }
    .sobre-mi__subtitulo {
      font-size: var(--text-project);
      line-height: var(--leading-project);
      font-weight: var(--weight-semibold);
      margin: 0 0 12px;
    }
    .sobre-mi__contacto {
      margin: 0 0 24px;
    }
    .sobre-mi__contacto-lista {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 24px;
    }
    .sobre-mi__contacto-lista a {
      text-decoration: none;
      border-bottom: 1px solid var(--border);
    }
    .sobre-mi__contacto-lista a:hover {
      border-bottom-color: var(--accent);
    }
    .sobre-mi__formacion {
      margin: 0;
    }
    .formacion {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .formacion__item {
      margin: 0 0 8px;
    }

    /* ============================================================
       PROYECTOS
       ============================================================ */
    .proyectos {
      display: grid;
      grid-template-columns: 1fr;
      gap: 32px;
    }
    @media (min-width: 700px) {
      .proyectos { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 1024px) {
      .proyectos { grid-template-columns: repeat(3, 1fr); }
    }

    .proyecto__marco {
      background: var(--accent-soft);
      padding: 12px;
      border-radius: var(--radius-lg);
      border: 1px solid transparent;
    }
    .proyecto__marco img {
      aspect-ratio: 16 / 10;
      object-fit: cover;
      width: 100%;
      border-radius: var(--radius-sm);
    }
    .proyecto__marco:hover { border-color: var(--border-strong); }
    .proyecto__marco:hover img { transform: scale(1.02); }

    .proyecto__nombre--destacado {
      font-size: var(--text-project-featured);
      line-height: var(--leading-project-featured);
      font-weight: var(--weight-semibold);
      margin: 12px 0 4px;
    }
    .proyecto__nombre {
      font-size: var(--text-project);
      line-height: var(--leading-project);
      font-weight: var(--weight-semibold);
      margin: 12px 0 4px;
    }
    .proyecto__resumen {
      font-size: var(--text-summary);
      line-height: var(--leading-summary);
      color: var(--ink-2);
      margin: 0 0 8px;
    }

    .chip {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: var(--text-meta);
      line-height: var(--leading-meta);
      background: var(--surface);
      border-radius: var(--radius-sm);
      padding: 2px 8px;
      color: var(--muted);
    }
    .chip:hover { background: var(--surface-2); }

    .meta {
      font-family: var(--font-mono);
      font-size: var(--text-meta);
      line-height: var(--leading-meta);
      color: var(--muted);
    }

    .estado {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 28px;
      padding: 0 12px;
      border-radius: var(--radius-full);
      font-family: var(--font-mono);
      font-size: var(--text-meta);
      line-height: var(--leading-meta);
      background: var(--surface);
    }
    .estado--ok   { color: var(--ok); }
    .estado--warn { color: var(--warn); }
    .estado--bad  { color: var(--bad); }

    /* ============================================================
       BOTONES
       ============================================================ */
    .boton {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      padding: 0 20px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      font-size: var(--text-summary);
      font-weight: var(--weight-medium);
      text-decoration: none;
      cursor: pointer;
    }
    .boton--primario {
      background: var(--btn);
      color: var(--btn-ink);
    }
    .boton--secundario {
      background: var(--surface);
      color: var(--ink);
    }
    .boton--secundario:hover { background: var(--surface-2); }
    .boton--pequeno { height: 36px; padding: 0 14px; }

    /* ============================================================
       FOOTER
       ============================================================ */
    .footer {
      margin-top: var(--section-gap);
      border-top: 1px solid var(--border);
    }
    .footer__inner {
      max-width: var(--max-content);
      margin: 0 auto;
      padding: 32px var(--gutter);
      color: var(--muted);
    }

    /* ============================================================
       5. MOVIMIENTO — solo sin reduced-motion
       ============================================================ */
    @media (prefers-reduced-motion: no-preference) {
      .hero__contacto a {
        transition: color var(--dur-fast) var(--ease),
                    border-color var(--dur-fast) var(--ease);
      }
      .sobre-mi__contacto-lista a {
        transition: border-color var(--dur-fast) var(--ease);
      }
      .proyecto__marco {
        transition: border-color var(--dur-fast) var(--ease);
      }
      .proyecto__marco img {
        transition: transform var(--dur-fast) var(--ease);
      }
      .chip {
        transition: background-color var(--dur-fast) var(--ease);
      }
      .boton {
        transition: background-color var(--dur-fast) var(--ease),
                    border-color var(--dur-fast) var(--ease);
      }

      .hero > * {
        animation: entrada var(--dur-slow) var(--ease) both;
      }
      .hero > *:nth-child(1) { animation-delay: 0ms; }
      .hero > *:nth-child(2) { animation-delay: var(--stagger); }
      .hero > *:nth-child(3) { animation-delay: calc(var(--stagger) * 2); }
      .hero > *:nth-child(4) { animation-delay: calc(var(--stagger) * 3); }
      .hero > *:nth-child(5) { animation-delay: calc(var(--stagger) * 4); }
    }
    @keyframes entrada {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
  </style>
